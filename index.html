<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>白山黑水·极北之旅</title>
<style>
/* ===== Theme Variables ===== */
:root{
--primary:#07C160;--primary-d:#06AD55;--bg:#F5F5F5;--card:#fff;--text:#333;--text-sub:#888;--text-hint:#bbb;--border:#f0f0f0;--shadow:0 2px 8px rgba(0,0,0,0.08);--r:12px;
--tag-scenic-bg:#E8F5E9;--tag-scenic-tx:#2E7D32;--tag-food-bg:#FFF3E0;--tag-food-tx:#E65100;--tag-shop-bg:#E3F2FD;--tag-shop-tx:#1565C0;
--warn-bg:#FFEBEE;--warn-tx:#C62828;--transport-bg:#FFF8E1;--transport-tx:#F57C00;--nav-bg:#fff;
--fs-base:14px;--fs-sm:12px;--fs-xs:11px;--fs-lg:16px;--fs-xl:18px;--fs-xxl:20px;
}
[data-theme="eye"]{
--primary:#5B8C5A;--primary-d:#4A7A49;--bg:#F5F0E8;--card:#FAF6EF;--text:#4A4A3A;--text-sub:#8A8A7A;--text-hint:#B5B5A5;--border:#E8E0D5;--shadow:0 2px 8px rgba(90,80,60,0.1);
--tag-scenic-bg:#E8F0E0;--tag-scenic-tx:#4A6B3A;--tag-food-bg:#F5EDE0;--tag-food-tx:#8A6B2A;--tag-shop-bg:#E0E8F0;--tag-shop-tx:#3A5B6B;
--warn-bg:#F5E8E0;--warn-tx:#8A4A3A;--transport-bg:#F5EDDC;--transport-tx:#8A6B2A;--nav-bg:#FAF6EF;
}
[data-theme="contrast"]{
--primary:#00AA00;--primary-d:#008800;--bg:#FFFFFF;--card:#FFFFFF;--text:#000;--text-sub:#333;--text-hint:#666;--border:#000;--shadow:0 0 0 2px #000;--r:8px;
--tag-scenic-bg:#00FF00;--tag-scenic-tx:#000;--tag-food-bg:#FFA500;--tag-food-tx:#000;--tag-shop-bg:#00BFFF;--tag-shop-tx:#000;
--warn-bg:#FF0000;--warn-tx:#FFFFFF;--transport-bg:#FFFF00;--transport-tx:#000;--nav-bg:#FFFFFF;
}
[data-fontsize="s"]{--fs-base:13px;--fs-sm:11px;--fs-xs:10px;--fs-lg:15px;--fs-xl:17px;--fs-xxl:19px}
[data-fontsize="l"]{--fs-base:16px;--fs-sm:13px;--fs-xs:12px;--fs-lg:18px;--fs-xl:20px;--fs-xxl:22px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs-base);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
/* Nav Bar */
.nav-bar{height:44px;background:var(--nav-bg);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;border-bottom:1px solid var(--border);z-index:10}
.nav-title{font-size:var(--fs-lg);font-weight:600}
.nav-right{position:absolute;right:16px;font-size:var(--fs-sm);color:var(--primary);cursor:pointer;display:flex;align-items:center;gap:2px}
/* Pages */
.page{display:none;flex:1;overflow:hidden;flex-direction:column;position:relative}
.page.active{display:flex}
/* Day Header */
.day-header{flex-shrink:0;padding:10px 16px 8px;background:var(--nav-bg);display:flex;align-items:center;justify-content:space-between}
.dh-left{display:flex;align-items:baseline;gap:6px}
.dh-date{font-size:var(--fs-xxl);font-weight:700}
.dh-week{font-size:var(--fs-sm);color:var(--text-sub)}
.dh-region{font-size:var(--fs-sm);color:var(--text-sub);margin-left:6px;background:var(--bg);padding:2px 8px;border-radius:10px}
.dh-right{display:flex;align-items:center;gap:6px}
.dh-progress{font-size:var(--fs-sm);color:var(--primary);font-weight:700}
.dh-dots{display:flex;gap:3px}
.dh-dot{width:5px;height:5px;border-radius:50%;background:var(--border);transition:all .3s;cursor:pointer}
.dh-dot.active{background:var(--primary);width:14px;border-radius:3px}
.dh-dot.done{background:var(--text-hint)}
/* Weather */
.weather-bar{background:var(--card);border-radius:var(--r);padding:10px 14px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.weather-bar .w-ic{font-size:22px}
.weather-bar .w-info{flex:1}
.weather-bar .w-loc{font-size:var(--fs-sm);color:var(--text-sub)}
.weather-bar .w-temp{font-size:var(--fs-lg);font-weight:700;color:var(--text)}
.weather-bar .w-desc{font-size:var(--fs-xs);color:var(--text-sub)}
.weather-bar .w-rain{font-size:var(--fs-xs);color:var(--primary);margin-left:6px}
/* Days Wrapper */
.days-wrapper{flex:1;display:flex;transition:transform .3s ease;will-change:transform;min-height:0}
.day-page{width:100vw;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;min-height:0}
/* Views Viewport */
.views-vp{flex:1;overflow:hidden;position:relative;min-height:0}
.views-ctn{height:200%;transition:transform .35s cubic-bezier(.32,1.2,.5,1);will-change:transform;min-height:0}
.views-ctn.show-b{transform:translateY(-50%)}
.view-a,.view-b{height:50%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px 100px}
/* Bottom spacer ensures last item is not hidden behind tab bar */
.view-bottom-spacer{height:40px;flex-shrink:0}
/* Hotel Card */
.hotel-card{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hotel-card .ic{font-size:20px}
.hotel-card .info{flex:1;min-width:0}
.hotel-card .lbl{font-size:var(--fs-xs);color:var(--text-sub);margin-bottom:1px}
.hotel-card .nm{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hotel-card .addr{font-size:var(--fs-xs);color:var(--text-hint);margin-top:1px}
.hotel-card .event-actions{flex-shrink:0}
/* Transport Bar */
.transport-bar{background:var(--transport-bg);border-radius:8px;padding:9px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--transport-tx)}
.transport-bar .ic{font-size:16px}
/* Timeline */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:8px}
.tl-dot{position:absolute;left:-22px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid var(--card);z-index:1}
.tl-item:first-child .tl-dot{background:var(--primary)}
/* Event Card */
.event-card{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);position:relative;transition:box-shadow .2s}
.event-card:active{box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.event-card.dragging{opacity:.6;border:2px dashed var(--primary);z-index:100}
.ev-top-btns{display:flex;gap:6px;margin-bottom:8px}
.ev-top-btns button{flex:1;padding:5px 8px;border:1px solid var(--border);background:var(--bg);border-radius:6px;font-size:var(--fs-xs);color:var(--text-sub);cursor:pointer}
.ev-top-btns button.primary{color:var(--primary);border-color:var(--primary);background:transparent}
.event-card .ev-hdr{display:flex;align-items:flex-start;gap:10px}
.event-card .ev-time{font-size:var(--fs-sm);color:var(--primary);font-weight:600;white-space:nowrap;min-width:42px;padding-top:1px}
.event-card .ev-body{flex:1;min-width:0}
.event-card .ev-name{font-size:var(--fs-base);font-weight:600;margin-bottom:3px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.type-tag{display:inline-block;font-size:var(--fs-xs);padding:1px 5px;border-radius:3px;font-weight:500}
.type-tag.t-scenic{background:var(--tag-scenic-bg);color:var(--tag-scenic-tx)}
.type-tag.t-food{background:var(--tag-food-bg);color:var(--tag-food-tx)}
.type-tag.t-shop{background:var(--tag-shop-bg);color:var(--tag-shop-tx)}
.type-tag.t-other{background:var(--bg);color:var(--text-sub)}
.event-card .ev-addr{font-size:var(--fs-xs);color:var(--text-sub);margin-bottom:3px;display:flex;align-items:center;gap:3px}
.event-card .ev-note{font-size:var(--fs-sm);color:var(--text-sub);line-height:1.4}
.warn-note{background:var(--warn-bg);color:var(--warn-tx);padding:5px 8px;border-radius:4px;font-size:var(--fs-xs);margin-top:5px;font-weight:500;display:flex;align-items:center;gap:4px}
.booking-tag{display:inline-flex;align-items:center;gap:2px;background:var(--warn-bg);color:var(--warn-tx);font-size:var(--fs-xs);padding:1px 5px;border-radius:3px;font-weight:500}
.event-actions{display:flex;gap:6px;margin-top:8px}
.event-actions button{flex:1;padding:5px;border:1px solid var(--border);background:var(--bg);border-radius:6px;font-size:var(--fs-xs);color:var(--text-sub);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px}
.event-actions button:active{background:var(--border)}
.event-actions button.nav-btn{color:var(--primary);border-color:var(--primary);background:transparent}
.drag-indicator{position:absolute;left:0;top:0;width:4px;height:100%;background:transparent;border-radius:var(--r) 0 0 var(--r)}
.event-card.long-press .drag-indicator{background:var(--primary)}
/* XHS View B */
.xhs-toolbar{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.xhs-cat{flex:1;display:flex;gap:4px}
.xhs-cat-pill{padding:4px 10px;border-radius:14px;font-size:var(--fs-xs);background:var(--card);color:var(--text-sub);cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.xhs-cat-pill.active{background:var(--primary);color:#fff}
.xhs-refresh{width:32px;height:32px;border-radius:50%;background:var(--card);border:none;box-shadow:var(--shadow);font-size:14px;cursor:pointer;color:var(--primary);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.xhs-refresh-more{width:100%;padding:10px;border:1px dashed var(--primary);background:transparent;color:var(--primary);border-radius:10px;font-size:var(--fs-sm);cursor:pointer;margin-top:6px;margin-bottom:20px;text-align:center;font-weight:500}
.xhs-refresh-more:active{background:rgba(7,193,96,.05)}
.xhs-block{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
.xhs-booking-bar{background:var(--warn-bg);color:var(--warn-tx);padding:7px 12px;font-size:var(--fs-xs);font-weight:600;display:flex;align-items:center;gap:4px}
.xhs-img{height:130px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;position:relative}
.xhs-img::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent,rgba(0,0,0,.2))}
.xhs-body{padding:12px 14px}
.xhs-title{font-size:var(--fs-base);font-weight:600;margin-bottom:5px;line-height:1.3}
.xhs-summary{font-size:var(--fs-sm);color:var(--text-sub);line-height:1.5;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.xhs-meta{display:flex;align-items:center;justify-content:space-between}
.xhs-author{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);color:var(--text-sub)}
.xhs-author .av{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#FF6B6B,#FF8E53);flex-shrink:0}
.xhs-likes{font-size:var(--fs-xs);color:#FF6B6B;display:flex;align-items:center;gap:3px}
.xhs-fav-btn{font-size:var(--fs-xs);color:var(--text-sub);display:flex;align-items:center;gap:3px;cursor:pointer;padding:2px 6px;border-radius:8px;background:transparent;border:none}
.xhs-fav-btn.faved{color:#FF6B6B}
/* XHS Reader Panel */
.xhs-reader{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:var(--r) var(--r) 0 0;z-index:101;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .3s ease;visibility:hidden;padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
.xhs-reader.active{transform:translateY(0);visibility:visible}
.xhs-reader-close{position:absolute;top:12px;right:12px;width:28px;height:28px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;z-index:1}
.xhs-reader-img{height:200px;display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff}
.xhs-reader-body{padding:16px 16px 100px}
.xhs-reader-title{font-size:var(--fs-lg);font-weight:600;margin-bottom:8px;line-height:1.4}
.xhs-real-badge{display:inline-block;vertical-align:middle;background:#FF2442;color:#fff;font-size:10px;font-weight:600;padding:2px 6px;border-radius:8px;margin-left:6px;letter-spacing:0.5px}
.xhs-reader-summary{font-size:var(--fs-md);color:var(--text-primary);line-height:1.7;margin-bottom:16px}
.xhs-reader-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.xhs-reader-actions{display:flex;gap:8px;margin-bottom:12px}
.xhs-reader-actions button{flex:1;padding:10px;border:none;border-radius:8px;font-size:var(--fs-sm);cursor:pointer;font-weight:500}
.xhs-reader-read{background:var(--primary);color:#fff}
.xhs-reader-jump{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.xhs-reader-fav{background:#FFF0F5;color:#FF6B6B;border:1px solid #FFC0CB}
.xhs-reader-fav.faved{background:#FF6B6B;color:#fff;border-color:#FF6B6B}
/* Drag Handle */
.drag-handle{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;opacity:0;transition:opacity .3s}
.drag-handle.show{opacity:.7}
.drag-handle .bar{width:32px;height:3px;background:rgba(0,0,0,.12);border-radius:2px}
.drag-handle .txt{font-size:var(--fs-xs);color:var(--text-sub);background:rgba(255,255,255,.85);padding:2px 7px;border-radius:8px;white-space:nowrap}
/* FAB */
.fab{position:absolute;bottom:20px;right:16px;width:48px;height:48px;background:var(--primary);color:#fff;border:none;border-radius:50%;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(7,193,96,.4);z-index:20;cursor:pointer;transition:transform .15s,opacity .3s}
.fab:active{transform:scale(.9)}
.fab.hidden{opacity:0;pointer-events:none}
/* Tab Bar */
.tab-bar{height:50px;background:var(--card);display:flex;border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-sub);cursor:pointer}
.tab.active{color:var(--primary)}
.tab .ic{font-size:20px;line-height:1}
.tab .tx{font-size:10px}
/* Profile */
.profile-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.sec-title{font-size:var(--fs-lg);font-weight:700;margin:14px 0 8px;display:flex;align-items:center;gap:5px}
.sec-title:first-child{margin-top:0}
.sec-title .cnt{font-size:var(--fs-sm);color:var(--text-sub);font-weight:400}
.check-item{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:6px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;cursor:pointer}
.check-item .cb{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--fs-xs);transition:all .2s}
.check-item.done .cb{background:var(--primary);border-color:var(--primary)}
.check-item.done .it-text{text-decoration:line-through;color:var(--text-hint)}
.check-item .it-text{font-size:var(--fs-base);flex:1}
.check-item .it-ic{font-size:18px}
/* Settings */
.settings-card{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.settings-row:not(:last-child){border-bottom:1px solid var(--border)}
.settings-label{font-size:var(--fs-sm);color:var(--text)}
.settings-ctrl{display:flex;gap:4px}
.settings-btn{padding:4px 10px;border-radius:8px;font-size:var(--fs-xs);border:1px solid var(--border);background:var(--bg);color:var(--text-sub);cursor:pointer}
.settings-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* Companions */
.comp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.comp-card{background:var(--card);border-radius:var(--r);padding:14px 8px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.comp-card .av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.comp-card .nm{font-size:var(--fs-xs);font-weight:500}
.comp-card .role{font-size:10px;color:var(--text-sub)}
.comp-card.me{border:2px solid var(--primary);position:relative}
.comp-card.me::after{content:'我';position:absolute;top:-6px;right:-6px;background:var(--primary);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px}
.comp-card .edit-hint{font-size:9px;color:var(--primary);margin-top:2px}
.comp-tags{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px}
.comp-tag{font-size:9px;background:var(--bg);color:var(--text-sub);padding:1px 5px;border-radius:6px}
.login-banner{background:linear-gradient(135deg,var(--primary),var(--primary-d));border-radius:var(--r);padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;color:#fff;box-shadow:var(--shadow)}
.login-banner .lb-ic{font-size:28px}
.login-banner .lb-info{flex:1}
.login-banner .lb-title{font-size:var(--fs-base);font-weight:600}
.login-banner .lb-sub{font-size:var(--fs-xs);opacity:.85;margin-top:2px}
.login-banner .lb-btn{background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 14px;border-radius:18px;font-size:var(--fs-xs);cursor:pointer;white-space:nowrap}
.login-banner .lb-avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px}
/* Companion Profile Modal */
.cp-profile{display:flex;flex-direction:column;align-items:center;padding:8px 0 14px}
.cp-avatar{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin-bottom:8px}
.cp-name{font-size:var(--fs-lg);font-weight:600}
.cp-role{font-size:var(--fs-sm);color:var(--text-sub);margin-top:2px}
.cp-tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.cp-tag{font-size:var(--fs-xs);background:var(--bg);color:var(--text-sub);padding:2px 8px;border-radius:8px}
.cp-fav-list{margin-top:8px}
.cp-fav-item{background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.cp-fav-item .fi-img{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0}
.cp-fav-item .fi-info{flex:1;min-width:0}
.cp-fav-item .fi-title{font-size:var(--fs-sm);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-fav-item .fi-sub{font-size:var(--fs-xs);color:var(--text-sub)}
/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal-content{background:var(--card);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:500px;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-grip{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:var(--fs-base);font-weight:600;margin-bottom:14px;text-align:center}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:var(--fs-xs);color:var(--text-sub);margin-bottom:3px}
.fg input,.fg textarea,.fg select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:var(--fs-base);font-family:inherit;background:var(--card);color:var(--text)}
.fg input:focus,.fg textarea:focus,.fg select:focus{outline:none;border-color:var(--primary)}
.fg textarea{resize:vertical;min-height:50px}
.fg .cb-row{display:flex;align-items:center;gap:6px}
.fg .cb-row label{margin:0;font-size:var(--fs-sm);color:var(--text)}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions button{flex:1;padding:10px;border:none;border-radius:8px;font-size:var(--fs-base);cursor:pointer;font-weight:500}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:var(--primary-d)}
.btn-danger{background:var(--card);color:#e53935;border:1px solid #e53935}
.btn-cancel{background:var(--bg);color:var(--text-sub)}
#deleteBtnWrap{margin-top:8px;display:none}
#deleteBtnWrap button{width:100%;padding:8px;border:1px solid #e53935;background:var(--card);color:#e53935;border-radius:8px;font-size:var(--fs-sm);cursor:pointer}
/* Nav Guide Modal */
.nav-guide-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:105;display:none;align-items:flex-end;justify-content:center}
.nav-guide-overlay.active{display:flex}
.nav-guide-content{background:var(--card);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:500px;padding:24px 20px calc(24px + env(safe-area-inset-bottom));animation:slideUp .3s ease}
.nav-guide-icon{text-align:center;margin-bottom:8px;font-size:32px}
.nav-guide-steps{padding:0 0 0 20px;margin:0 0 18px;list-style:none;counter-reset:step}
.nav-guide-steps li{position:relative;margin-bottom:10px;padding-left:10px;font-size:var(--fs-sm);color:var(--text);line-height:1.6}
.nav-guide-steps li::before{counter-increment:step;content:counter(step);position:absolute;left:-20px;top:3px;width:20px;height:20px;background:var(--primary);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;line-height:1}
.nav-guide-btn{width:100%;padding:14px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:var(--fs-base);font-weight:600;cursor:pointer;letter-spacing:.5px}
.nav-guide-btn:active{background:var(--primary-d);transform:scale(.98)}
/* Backdrop */
.xhs-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;opacity:0;visibility:hidden;transition:opacity .3s}
.xhs-backdrop.active{opacity:1;visibility:visible}
.xhs-panel-close{position:absolute;top:12px;right:12px;width:28px;height:28px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;z-index:1}
/* Tag/Role/Emoji/Color Picker */
.tag-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag-chip{padding:5px 12px;border-radius:16px;font-size:var(--fs-sm);border:1px solid var(--border);background:var(--card);color:var(--text-sub);cursor:pointer;user-select:none;transition:all .15s}
.tag-chip.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px;max-height:200px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.role-chip{padding:8px 4px;border-radius:8px;font-size:var(--fs-sm);border:1px solid var(--border);background:var(--card);color:var(--text-sub);text-align:center;cursor:pointer;user-select:none;transition:all .15s}
.role-chip.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
.emoji-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:4px;max-height:180px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.emoji-opt{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:2px solid transparent;background:var(--bg);user-select:none}
.emoji-opt.selected{border-color:var(--primary);background:#e8f8ef}
.color-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.color-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;user-select:none;transition:transform .15s}
.color-opt.selected{border-color:#333;transform:scale(1.15)}
/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:8px;font-size:var(--fs-sm);z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* Day Nav Arrows */
.day-nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:15;color:var(--text-sub);transition:opacity .2s}
.day-nav-arrow:active{background:var(--bg)}
.day-nav-arrow.hidden{opacity:0;pointer-events:none}
.day-nav-prev{left:8px}
.day-nav-next{right:8px}
/* View Toggle Hint */
.view-toggle-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:8}
.vt-pill{padding:4px 12px;border-radius:14px;font-size:var(--fs-xs);background:rgba(255,255,255,.92);box-shadow:var(--shadow);color:var(--text-sub);cursor:pointer;transition:all .2s}
.vt-pill.active{background:var(--primary);color:#fff}
/* Scrollbar hide */
.view-a::-webkit-scrollbar,.view-b::-webkit-scrollbar,.profile-scroll::-webkit-scrollbar,.modal-content::-webkit-scrollbar,.xhs-reader::-webkit-scrollbar{display:none}
</style>
</head>

['罗沙公园周边美食地图🍜','公园出来走5分钟有家东北菜馆，锅包肉一绝。还有铁锅炖也值得一试，人均40吃得很饱。可以逛完公园直接去吃饭。','food'],
['罗沙公园｜日落拍摄全攻略📸','公园人工湖西侧是拍落日的最佳位置。夏天7点左右太阳正好从树梢间落下，水面倒影特别好看。记得带三脚架。','photo'],
['罗沙公园vs红案公园｜哪个更值得去？⚖️','两个公园风格不同：罗沙更大更开阔，适合散步运动；红案更精致，适合拍照。时间充裕建议两个都去，步行距离。','guide'],
['夏日罗沙公园｜避暑遛弯好去处🌳','公园树荫覆盖率高，夏天比外面低2-3度。湖边长廊通风好，坐着吹风很惬意。带本书可以待一整个下午。','guide'],
['罗沙公园花卉图鉴｜春天赏花攻略🌸','春天公园里丁香、杏花、桃花依次开放。4月下旬到5月中旬是最佳赏花期。靠近东门的花坛品种最多。','photo'],
['本地人才知道的罗沙公园隐藏玩法🔍','公园东北角有个观鸟台，能看到啄木鸟和灰喜鹊。带上望远镜有惊喜。还有个废弃的老凉亭很有年代感。','guide']
],
'红案公园':[
['红案公园打卡｜比想象中好逛很多✨','公园不大但很精致，有湖有亭子，适合带家人来玩。周边小吃也多，逛完可以吃个饭。','photo','https://www.xiaohongshu.com/discovery/item/6a4b13fb000000000f017ba7?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBntxlcSQtjuFApUAzgco-vDJB_PuUsScyOEVxxcEw44s=&author_share=1&&apptime=1786548279&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=eb61074204e448dc99d2d3721ad1c43c&xhsshare=CopyLink'],
['红案公园｜齐齐哈尔隐藏拍照圣地📷','公园里的红墙和绿瓦配色很上镜，尤其下午阳光斜照的时候。穿汉服或者复古风来拍特别有感觉。','photo','https://www.xiaohongshu.com/discovery/item/689ff19f000000001b0224d7?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBP8i7uPfaABnU5AYqMqVf62ce_0lfL_AezE9GKidOn2E=&author_share=1&&apptime=1786548291&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=4fdb1487373b40c7bf82f93ff1831c86&xhsshare=CopyLink'],
['红案公园晨练攻略｜感受东北慢生活🌅','早上6点就有大爷大妈来锻炼了，打太极的、踢毽子的、唱戏的，特别热闹。可以融入体验一下本地人的生活。','guide','https://www.xiaohongshu.com/discovery/item/6a41ea27000000001101120f?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBgfJfCXMm2UEpxbjnXZGZp0QsUlsI7uLuqfh8ocbAKbs=&author_share=1&&apptime=1786548224&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=d1090c43ae3045dca659a2ac521f484c&xhsshare=CopyLink'],
['红案公园周边早餐推荐🥟','公园南门出来有家开了二十年的豆腐脑店，搭配油条绝了。还有家牛肉包子铺，皮薄馅大一绝，每天限量。','food','https://www.xiaohongshu.com/discovery/item/68beb1f6000000001d029012?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBTPN_c043zAl5Yk958FXYezOfsLJbM7vy4K8uDDyOlg4=&author_share=1&&apptime=1786548174&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=dd46b1ccaa4b4fdf955ff9e710d9971e&xhsshare=CopyLink'],
['红案公园｜带父母出游的好选择👴👵','路很平，没有太多台阶，适合老人散步。湖心亭可以坐下来休息喝茶。父母很喜欢这种悠闲的节奏。','guide','https://www.xiaohongshu.com/discovery/item/699ac3f8000000000a02d6fd?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB4sZSg1dEMx9dK5LlHQqbm9K2e1zZU9MdwrWgn4t9uNc=&author_share=1&&apptime=1786548196&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=1ba0fdf28e64437fa637d8f8cdb49aeb&xhsshare=CopyLink'],
['红案公园最全拍照位｜9个出片点合集📸','从南门进逆时针走：①红墙拱门②湖心亭③石桥④月季花墙⑤假山瀑布⑥长廊光影⑦北门牌坊⑧银杏道⑨河边柳树，一次拍够。','photo'],
['冬季红案公园｜雪后别样美景❄️','下雪后的红案公园像水墨画一样。红墙白雪的对比特别好看。湖面结冰后有人在上面滑冰，很有东北特色。','photo'],
['红案公园夜游体验🌙','晚上公园亮灯后很漂亮，湖面倒影五彩灯光。人少安静，适合饭后散步消食。8点左右最佳。','guide'],
['红案公园历史文化小考📖','公园建于上世纪50年代，原名XX公园。里面有几棵百年老树值得一看。了解历史后再逛，感觉完全不一样。','guide'],
['红案公园附近美食一条街｜逛吃路线🍢','从北门出来往东走，一条街全是小吃。烤冷面、铁板鱿鱼、炸鸡架，东北小吃大全。人均20吃到撑。','food'],
['红案公园｜一个人发呆的好地方🧘','找个湖边的长椅坐下，看水鸟游来游去，听风吹树叶的声音。放空一小时，治愈指数爆表。','guide']
],
'罗西亚大街历史文化街区':[
['百年俄式街区｜穿越中东铁路时光🚂','保存完好的俄式建筑群，走在街上仿佛穿越到百年前。每栋建筑都有故事，建议请个讲解或者提前做功课。','guide','https://www.xiaohongshu.com/discovery/item/6a674af1000000000f011870?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBY1C4kG209tFSXyjAhNXAowdz5eTua8sIk2VAn0Jh_70=&author_share=1&&apptime=1786548335&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=2db4164f887e46a5a28062c46a9b1e8d&xhsshare=CopyLink'],
['罗西亚大街｜建筑迷的天堂🏛️','这里有俄式、巴洛克、折中主义等多种建筑风格。每栋楼的窗棂、门楣都充满细节。建筑系学生一定会爱上这里。','photo','https://www.xiaohongshu.com/discovery/item/6895acf00000000025013c16?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBlCmscWcBYz-luTNort6eg8pKE5j3wp8JdEZgG8AO5jo=&author_share=1&&apptime=1786548537&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=e7335f48c7c64245b3f1c53c3a1bbce9&xhsshare=CopyLink'],
['罗西亚大街最全拍照攻略📸','推荐拍照顺序：①火车站旧址②领事馆旧址③俄式黄房子④老街转角⑤铁轨遗址。穿复古风或旗袍超级应景。','photo','https://www.xiaohongshu.com/discovery/item/69f545fc000000001f00795f?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBla790xnZUOcYUiTek6yLFuWi13EYMVUhcI7oj5xOlgk=&author_share=1&&apptime=1786548328&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=b821542e36934022bb11a717632852f4&xhsshare=CopyLink'],
['罗西亚大街历史溯源｜中东铁路的故事📖','1898年中东铁路开工，大批俄国人来到齐齐哈尔，留下了这条街。每一栋建筑背后都有一段跌宕的历史。建议先了解背景再去。','guide','https://www.xiaohongshu.com/discovery/item/69eede3e00000000360320c6?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB9C1PVcpoeWPr7fvuPiqWJZ0CDsuf8P9hNaxSIh3Wlo4=&author_share=1&&apptime=1786548494&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=ee0be9ed1fc34c3a9d8e48ca779a3ba1&xhsshare=CopyLink'],
['罗西亚大街｜黄昏时分最美🌇','下午4-6点光线最好，金色阳光洒在黄色俄式建筑上特别温暖。夕阳下的剪影也超级好看。建议这个时间段去。','photo','https://www.xiaohongshu.com/discovery/item/6822d140000000000f031759?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBbXSYwGCMNs3JGNOXxoiadVK9y3OHom3VTw_y7h9XmXg=&author_share=1&&apptime=1786548517&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=d2dab2565ebe4984a6290fed01976a93&xhsshare=CopyLink'],
['罗西亚大街附近美食｜正宗俄式西餐🍽️','街上有家开了十几年的俄式西餐厅，红菜汤和罐焖牛肉是招牌。还有俄式列巴和格瓦斯，味道很正宗。','food','https://www.xiaohongshu.com/discovery/item/6a48f58c000000000f01e565?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBHGHLDjAUhNQGliKiLrK_PM-_UjWIZWFIZujLlfJ_bwI=&author_share=1&&apptime=1786548475&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=2daf6bb8b4d94c11b7767206fed8e619&xhsshare=CopyLink'],
['罗西亚大街｜避开人流的最佳时间⏰','工作日上午人最少，可以安静地拍照。周末下午会有一些游客和拍婚纱的新人。建议早上9点就到。','guide'],
['罗西亚大街+齐齐哈尔站｜一日历史漫步🗺️','建议路线：火车站出发→罗西亚大街→午餐俄式西餐→下午继续逛街区→傍晚拍照。全程步行约3小时，节奏轻松。','guide'],
['罗西亚大街的电影感🎬','这里太适合拍电影了！每个转角都是天然的取景框。戴个贝雷帽，穿件风衣，随便一拍就是欧洲文艺片海报。','photo'],
['罗西亚大街｜带父母来重温历史👴👵','很多长辈对中东铁路历史有共鸣，带他们来看看这些老建筑，会勾起很多回忆。路面平坦好走，不用担心体力。','guide'],
['冬天的罗西亚大街❄️','雪后的俄式街区更有感觉！黄墙白雪，像童话里的场景。人少安静，拍照不会有人抢镜。穿亮色衣服更出片。','photo']
],
'扎龙自然保护区':[
['丹顶鹤的故乡｜扎龙湿地超全攻略🦢','一定要查好丹顶鹤放飞时间！一般每天有2-3次放飞表演，场面震撼。建议带望远镜和长焦镜头，湿地栈道走走也很舒服。门票75元。','guide','https://www.xiaohongshu.com/discovery/item/6a6336b2000000000101c4fe?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBGGkkaq3tyYd3zV1NxSANOoGAGikhtAXevMg8I-VZPZY=&author_share=1&&apptime=1786548577&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=b903f1add5c6408db750d4f175417418&xhsshare=CopyLink'],
['扎龙湿地｜丹顶鹤放飞时间+最佳观赏位⏰','放飞时间以景区公告为准，一般是上午10点和下午2:30各一场。站在观鹤台正前方30米位置拍摄角度最好。提前半小时占位！','guide','https://www.xiaohongshu.com/discovery/item/6a7afe160000000035015cf1?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB7dGz925fNwSEdhBDMXDXt_Qg8a6anGBG3NEloUC9HKI=&author_share=1&&apptime=1786548590&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=c213693d989d40b5aef92193d824f2ed&xhsshare=CopyLink'],

['扎龙湿地深度游｜一日行程安排🗓️','建议行程：9点到→9:30观鸟科普馆→10:00丹顶鹤放飞→11:00湿地栈道徒步→12:30午餐→14:00第二次放飞→15:30返回。','guide','https://www.xiaohongshu.com/discovery/item/6a7c45e7000000002800bdee?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBANtqFWubpOzlQr6phc3z6W-FuA9FZgt5XUjujClaEP4=&author_share=1&&apptime=1786548597&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=adcaaa80277f415d80abc7096cfab91c&xhsshare=CopyLink'],
['扎龙湿地｜带娃亲子游攻略👨‍👩‍👧','小朋友看到鹤飞起来的时候全程尖叫！科普馆有互动展示，寓教于乐。带上望远镜让娃自己找鸟，能玩一整天。','guide','https://www.xiaohongshu.com/discovery/item/6a7c43e500000000320302a1?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBANtqFWubpOzlQr6phc3z6URPVOJFJLRl3AmHaq5-Iy8=&author_share=1&&apptime=1786548677&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=debcc1ba91ca4bd1bb9dcd759f97c5fa&xhsshare=CopyLink'],

['扎龙湿地｜航拍视角太震撼了🚁','湿地从空中看像一块巨大的翡翠。蜿蜒的水道和金色的芦苇构成绝美图案。不过航拍需要提前报备哦！','photo','https://www.xiaohongshu.com/discovery/item/6a7702aa000000003300fb02?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB7PLSEfvEM1V4I7yVXvM9-pOQqHeRzuKNJPnM5ZdQLrE=&author_share=1&&apptime=1786548689&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=3395d04f0f7a486499358d88d36671f6&xhsshare=CopyLink'],
['扎龙湿地美食｜景区周边吃什么🍚','景区门口有农家院，铁锅炖大鹅和野生鱼是特色。推荐炖杂鱼，汤鲜味美。价格略贵但味道不错。','food','https://www.xiaohongshu.com/discovery/item/6a7c65ca0000000025009304?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBANtqFWubpOzlQr6phc3z6a2AN9LQnNJulUaY4DxU7Vk=&author_share=1&&apptime=1786548640&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=398d746a55e64e8499f6847998cbba69&xhsshare=CopyLink'],
['扎龙湿地拍照｜手机也能出大片📱','人像模式拍湿地背景虚化效果很好。广角拍全景，长焦拍鹤。调色建议提高饱和度和对比度，让绿色更浓郁。','photo','https://www.xiaohongshu.com/discovery/item/6a202ecf000000000803fa0c?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBCOfYzCSH5wYE40UAdXROflI8dzN9WgQPwBLT2ikW46g=&author_share=1&&apptime=1786548652&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=41320ca4be6d4e5b806f0e9e2ea387ee&xhsshare=CopyLink']
],
'北国鄂温克驯鹿场':[
['在漠河撸驯鹿｜鄂温克使鹿部落🦌','近距离接触驯鹿，可以喂食和拍照。驯鹿很温顺，苔藓10元一筐。了解鄂温克族文化，非常有意义的体验！','photo','https://www.xiaohongshu.com/discovery/item/696318cd000000001a01c58c?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBcHqJHtPtUyTccLBu0tCZOBYXEXm31P5y2Aq_WoE1wq0=&author_share=1&&apptime=1786548709&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=8e3fb048d7bd426295799f9b7836d028&xhsshare=CopyLink'],
['鄂温克驯鹿部落｜民族文化的活化石🏕️','鄂温克族是中国最后一个狩猎民族。在这里可以了解他们的传统生活方式、狩猎文化和驯鹿饲养。尊重民族文化很重要。','guide','https://www.xiaohongshu.com/discovery/item/6a64d150000000000f010819?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBnmQpeGjQT-lSdFUooWd4rDwHnZ5jRmi3BJ0vs5C-ELY=&author_share=1&&apptime=1786548748&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=6ccd92a292ca44beaa23ef872957a7b2&xhsshare=CopyLink'],
['驯鹿场拍照技巧｜怎么拍出童话感📸','低角度仰拍，把驯鹿的角框在蓝天里。喂食的时候抓拍互动瞬间。穿民族风或森系穿搭超上镜。逆光拍毛发发光效果。','photo','https://www.xiaohongshu.com/discovery/item/6a7b0bbb000000002500e022?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB54g7DRRlhCdqYekBeYNfEWJy9zBVUBmhK9utIxPhyLk=&author_share=1&&apptime=1786548761&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=dee503738a884ac0b362f67297bff5d7&xhsshare=CopyLink'],
['鄂温克部落｜冬季体验更震撼❄️','冬天来更有一番风情！驯鹿在雪地里拉雪橇，像圣诞老人的座驾。雪中的撮罗子（传统住所）特别有感觉。穿厚点！','guide'],
['驯鹿场必买特产｜鹿产品推荐🛍️','鹿茸片、鹿心血、鹿角工艺品都是特色。鹿奶皂很滋润适合当伴手礼。记得货比三家，景区价格偏贵。','guide'],
['鄂温克驯鹿｜亲子游必打卡👶','小朋友喂驯鹿的画面太治愈了！驯鹿很温顺不会攻击人。建议买两筐苔藓，一筐根本不够喂。','guide'],
['鄂温克文化｜撮罗子里喝鹿奶茶☕','体验在撮罗子（传统帐篷）里喝鹿奶茶，听鄂温克老人讲打猎故事。虽然语言不太通但肢体语言就够了。很特别的体验。','food'],
['驯鹿场+北极村一日游路线🚗','上午驯鹿场（1.5小时）→午餐→下午北极村风景区→傍晚北极沙洲。两个景点距离不远，一天刚好。','guide'],
['驯鹿场避坑指南⚠️','不要大声喧哗惊吓驯鹿。不要喂自带的食物。拍照不要开闪光灯。尊重当地民族习俗，进入撮罗子要先询问。','guide'],
['驯鹿场｜夏天vs冬天完全不同的体验🌞❄️','夏天驯鹿在树林里乘凉，绿色背景拍照清新。冬天驯鹿拉雪橇、雪地奔跑，像走进纳尼亚传奇。各有所美，看季节安排。','guide'],
['驯鹿场的日出🌄','如果住得近，清晨来驯鹿场看日出是个隐藏玩法。晨雾中鹿群若隐若现，画面梦幻到不真实。记得穿暖和。','photo']
],
'北极旅游村风景区':[
['找到北了！北极村最全打卡指南🧭','中国最北的村庄！打卡最北邮局、最北哨所、最北一家。记得寄一张明信片给自己，邮戳超有纪念意义。','guide','https://www.xiaohongshu.com/discovery/item/69905935000000002801d7b9?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB1I1geMIpDk65zqAnm_bfnHhrQ92Hb_h0MsOwZMqL1GA=&author_share=1&&apptime=1786548856&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=b85ec80fc52a4c79b73855d5a1bd6a60&xhsshare=CopyLink'],
['北极村｜最北邮局的仪式感💌','最北邮局的明信片+最北邮戳=完美纪念品。可以写给一年后的自己，邮局有慢递服务。明信片5-20元不等，选风景款最好。','guide','https://www.xiaohongshu.com/discovery/item/6a747ba3000000003300e562?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBPHt00C3K8a8AYLjp8K0_KBgkwo6KX1c4Ir20rs_1J4w=&author_share=1&&apptime=1786548867&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=d09e59fab59b4c3c99a9f4ae2654c7ba&xhsshare=CopyLink'],
['北极村拍照挑战｜集齐N个最北📍','最北邮局、最北哨所、最北一家、最北厕所、最北金融机构……一路集邮式打卡超有趣。每个都能拍出"找到北"的感觉。','photo','https://www.xiaohongshu.com/discovery/item/6a649ddc000000000f0071ce?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBnmQpeGjQT-lSdFUooWd4rN9pOyiC6NZi8e65Q6LGW2U=&author_share=1&&apptime=1786548877&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=33d2f987af1642fe9dc40028a6db188b&xhsshare=CopyLink'],
['北极村住宿怎么选？🏨','村里住宿从农家乐到精品民宿都有。推荐住有火炕的农家院，体验东北大炕。提前预订，旺季房源紧张。','guide','https://www.xiaohongshu.com/discovery/item/6a6471c6000000000c015cb4?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBnmQpeGjQT-lSdFUooWd4rBBeXvS-TkzKt3AjEt_xslM=&author_share=1&&apptime=1786548844&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=5853e840676c449daa0d268f8a53a588&xhsshare=CopyLink'],
['北极村美食指南｜地道东北菜🥘','铁锅炖、杀猪菜、野生江鱼是必吃。推荐村里老字号"北极人家"，笨鸡炖蘑菇一绝。早餐来碗大碴子粥暖胃。','food','https://www.xiaohongshu.com/discovery/item/68ebde260000000005032c4f?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB9kEv0WzezY3CIX2TDqEscXaZ-BhJOXUnuBNnWGs5cLk=&author_share=1&&apptime=1786548838&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=02b6321b6b154d36956c87eb7e7937f3&xhsshare=CopyLink'],
['北极村｜晚上能看到极光吗？🌌','虽然叫北极村，但在中国境内看到极光的概率很低（约6-9月有机会但不保证）。不过星空是真的美！夏季银河清晰可见。','guide','https://www.xiaohongshu.com/discovery/item/68baeb87000000001b03e924?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBANNYsGU0wcP-y4MU_JgU026yf6swEVwkyGQq0ie3Dws=&author_share=1&&apptime=1786548850&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=86a26ce4963a44cbb7ae357db466b3ca&xhsshare=CopyLink'],
['北极村的星空｜银河拍摄指南⭐','光污染极少，是中国最佳星空观赏地之一。带上三脚架，ISO3200，快门20秒，光圈开最大。夏季银河横跨天际，太震撼了。','photo','https://www.xiaohongshu.com/discovery/item/68b5b855000000001d02cfb8?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBg_dcTTKf6-b6m34OafBNQ2haaI5VYS0wrHG1LiZK2Tg=&author_share=1&&apptime=1786548888&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=0a0027be5c2d4183b730c2defb5c655d&xhsshare=CopyLink'],
['北极村｜最北哨所打卡🇨🇳','最北哨所是军人驻守的地方，只能在外围拍照。每天有升旗仪式非常庄严，值得观看。注意不要拍内部设施。','guide'],
['北极村冬季攻略｜零下40度生存指南🥶','穿三件羽绒服都不嫌多！暖宝宝贴满全身，手机要贴身放否则秒没电。但雪景和冰雕绝对值回票价。','guide'],
['北极村｜清晨黑龙江边🌅','早上5点起来去江边看日出，对面就是俄罗斯。江面雾气缭绕，像仙境一样。这个时候人最少，独享宁静。','photo'],
['北极村夜景🌙','村里的灯光装饰很漂亮，尤其是冰雪大世界（冬季）。散步在安静的小村路上，抬头就是漫天繁星。','photo']
],
'北极沙洲':[
['北极沙洲｜中国最北点打卡📍','黑龙江畔的沙洲，可以走到江边看对岸俄罗斯。金鸡之冠雕塑是必打卡点，建议穿舒适鞋子，木栈道要走一段。','photo','https://www.xiaohongshu.com/discovery/item/69a40b3e000000002603f2ef?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBm7h76QIwgLOx2kPVXMdC0yG72kLzVZBeGwRHkWdQvP8=&author_share=1&&apptime=1786548909&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=71dcfebd1925414a8c3ec4561e96fb6f&xhsshare=CopyLink'],
['北极沙洲徒步攻略｜路线&时间🚶','从入口到最北点约2公里，木栈道很好走。往返+拍照约1.5小时。沿途有木屋、瞭望塔可以休息。带水！','guide','https://www.xiaohongshu.com/discovery/item/6923bf95000000001e023f8e?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBHXtAuOBvEpVNrnLJxWz0KUSpyyUCDnNJx0aFnoRlyw0=&author_share=1&&apptime=1786548921&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=e480d205ad1542f580ba20007b93c5f7&xhsshare=CopyLink'],
['北极沙洲｜最北点的日出有多美🌅','凌晨3点多天就亮了（夏季）！从最北点看日出，你就是全中国最早看到太阳的人之一。这种仪式感无价。','photo','https://www.xiaohongshu.com/discovery/item/69f8607a0000000038037817?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBbYF9sdRVfWCY5KXmchSh8nQvHqlv6GcvNx5NFCJzHz8=&author_share=1&&apptime=1786548936&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=17726c01e9384d6ca62318f0bb085551&xhsshare=CopyLink'],
['北极沙洲｜隔江望俄罗斯🇷🇺','沙洲就在黑龙江边，江对岸就是俄罗斯的村庄。肉眼可以看到对面的房屋和哨所。带个望远镜看得更清楚。','guide','https://www.xiaohongshu.com/discovery/item/68b05954000000001d013770?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CByDHvNl8JaeD0l-8fAhj7JWq5Urk6_RrJv26DtXFkihY=&author_share=1&&apptime=1786548943&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=0c0fbe53562a44d2ae7068cd67298338&xhsshare=CopyLink'],
['北极沙洲拍照｜金鸡之冠合影技巧🐔','金鸡之冠雕塑是北极沙洲标志。正面拍打卡照，侧面拍剪影也有感觉。建议等没人了再拍，背景干净。','photo','https://www.xiaohongshu.com/discovery/item/6a2422130000000007026913?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=video&xsec_token=CBgKDXFB6TV3mG1CbpTQdBVls1F5_UwwPNSS1xBSCNYZ4=&author_share=1&&apptime=1786548928&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=9a73f09d2a284824994097dd0e246119&xhsshare=CopyLink'],
['北极沙洲｜什么时间去最好？⏰','推荐清晨或傍晚：清晨人少光线柔和，傍晚可以看日落。中午太晒且游客多。冬季雪后去别有风味。','guide','https://www.xiaohongshu.com/discovery/item/67b5cf56000000000302baf6?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB7Ap12vaeg841FgF92g_nfQOeOyoRyZdVnMvJJ566JYk=&author_share=1&&apptime=1786548977&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=26cb15fd3be34b2cbb3896898a8dc860&xhsshare=CopyLink'],
['北极沙洲｜带孩子来需要注意什么👶','栈道没有护栏的地方多，看好小朋友。江边水急不能靠近。带个放大镜让孩子观察苔藓和野花，增加趣味性。','guide'],
['北极沙洲｜冬季江面结冰体验❄️','冬天黑龙江完全冰封，可以在江面上走（注意安全区域！）。冰上拍照超酷，感觉自己站在世界的尽头。','photo'],
['北极沙洲｜一个人的安静时光🧘','找个江边的石头坐下，看着江水缓缓流过，对面是异国他乡。放空自己，感受"世界尽头"的宁静。','guide'],
['北极沙洲+北极村｜一日游玩顺序🗺️','建议上午北极沙洲（凉快人少）→中午回村吃饭→下午北极村风景区→傍晚最北邮局。这样避开最晒的时段。','guide']
],
'乌苏里浅滩':[
['乌苏里浅滩｜中国真正的最北点🌊','很多人以为北极村是最北，其实乌苏里浅滩才是！和龙江第一湾联票更划算。江边风景壮阔，值得一去。','guide','https://www.xiaohongshu.com/discovery/item/6953e8bb000000001e028b05?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBijrJglxZNma1uwGzfjn7aB46VeZUQxUFg6TIMbVnuYk=&author_share=1&&apptime=1786549399&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=4aa4db5b20114a018820df4b5f25dcec&xhsshare=CopyLink'],
['乌苏里浅滩｜比北极村更值得去？⚖️','论地理位置乌苏里浅滩纬度更高（最北点），但北极村更有旅游氛围。两个都去最完美，自驾50分钟可达。','guide','https://www.xiaohongshu.com/discovery/item/6a5a5e96000000000f02b163?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBNaTDeUBOUSCkMrAKzdgpbr54i6SqJi9UTEErKsZONmg=&author_share=1&&apptime=1786549406&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=98790301cfa54ce39de2d027069ca89a&xhsshare=CopyLink'],
['乌苏里浅滩｜一个人承包整个江岸🌾','相比北极村这里游客少很多。安静地坐在江边，看江水滔滔，天地辽阔。适合喜欢安静和原生态风景的人。','guide','https://www.xiaohongshu.com/discovery/item/6a39189500000000080006b8?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBukXDtcDJ4Arr8H7ErQ5lF9BBFMkuBMNIJh935CbD-y4=&author_share=1&&apptime=1786549424&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=535b8362d41d476d951c26cea5d94f63&xhsshare=CopyLink'],
['乌苏里浅滩拍照｜江天一色的大片📸','江面开阔，天空占比大。低角度拍能突出人和天地的对比。穿红色或黄色等亮色衣服在蓝色背景下超级出片。','photo','https://www.xiaohongshu.com/discovery/item/6a5ba586000000001d023797?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBjPN_Jn7hKexPiWGdvBrOJTRRt-GA7Vj3Ljto6jCRAUI=&author_share=1&&apptime=1786549436&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=c2fdd9312c0245ae84a3ea469392a0f1&xhsshare=CopyLink'],
['乌苏里浅滩+龙江第一湾联票攻略🎫','两个景点联票更划算，比单独买省30%左右。建议先到乌苏里浅滩拍照，再去龙江第一湾爬观景台（体力好的时候去）。','guide','https://www.xiaohongshu.com/discovery/item/6a706c9f000000002500ee8b?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBbyxRKhwNu0Lp2nBCr2eCFyPIPI2VYMzL6bnAJ4LP_ys=&author_share=1&&apptime=1786549389&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=1e6920b2ca714a18a2a3b8ca917b757a&xhsshare=CopyLink'],
['乌苏里浅滩｜自驾路线详解🚗','从北极村出发约50分钟车程，路况一般有土路。建议用离线地图，这段路信号不好。SUV底盘高更安心。','guide','https://www.xiaohongshu.com/discovery/item/6a574531000000002100b1d3?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBcWOpn2YSZd3uimg1V_pUfAw6f1hbmdLIie7qlMlh3A8=&author_share=1&&apptime=1786549413&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=e870edee3ce44b78bb1e45c83d0306cf&xhsshare=CopyLink'],
['乌苏里浅滩｜什么季节最壮观？🌿❄️','夏季江水丰沛最壮观，秋季两岸金黄层次感强，冬季冰封有极地感。个人最推荐秋季9月中下旬。','photo'],
['乌苏里浅滩的日落🌅','日落时分整个江面变成金色，超级壮观。夏季日落晚（8点左右），冬季早（4点多）。提前查好时间别错过。','photo'],
['乌苏里浅滩｜中国最北点界碑📍','这里有一块"中国最北点"的界碑，比北极村的更准确。拍照打卡发朋友圈，配文"终于走到祖国最北端"。','guide'],
['乌苏里浅滩避坑指南⚠️','路况不太好，雨天泥泞影响出行。建议晴天前往。没有餐饮设施，自带水和零食。手机信号弱，提前下离线地图。','guide']
],
'龙江第一湾风景区':[
['龙江第一湾｜登高望远值得！🏔️','需要爬几百级台阶登高俯瞰，虽然累但看到全景的那一刻值了！黑龙江在这里画了一个完美的Ω形弯。建议早上去，光线好。','photo','https://www.xiaohongshu.com/discovery/item/68de15e7000000000703283e?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBeAoSXAZR4NdDnitHCZ2aCixCuC3y3tifMXwRBMVULPg=&author_share=1&&apptime=1786549463&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=4c3f60542c9044c588859767f35148dd&xhsshare=CopyLink'],
['龙江第一湾｜爬台阶体力需求实测💪','大约800-900级台阶，普通人体力30-40分钟登顶。中间有3个休息平台。带瓶水、慢慢爬，不要急。山顶风景是最好的回报。','guide','https://www.xiaohongshu.com/discovery/item/6a79a83d0000000005029ddc?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBvVR1xnhH9WAhjpMRnUE14F5OMyd2PIrzPpmXutADwSo=&author_share=1&&apptime=1786549454&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=7721da494d934a6a80dec71360b37b5c&xhsshare=CopyLink'],
['龙江第一湾｜航拍Ω形弯攻略🚁','从山顶起飞，拍Ω形弯的全景。注意风向，江边风大容易炸机。飞行高度200米以上才能拍全整个弯。遵守当地飞行规定。','photo','https://www.xiaohongshu.com/discovery/item/6a7846a60000000029031361?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB-vaiF7LqEElB6oOYmD3DWCEaiYxsBlhcCcRCMN6ZwnA=&author_share=1&&apptime=1786549533&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=63ec26c787034e61b7271a803aab45e7&xhsshare=CopyLink'],
['龙江第一湾｜最佳观赏时间+天气选择☀️','晴天最佳！上午9-11点光线从侧面照来，Ω形弯的层次感最丰富。阴天效果差很多。雨后空气通透也是好时机。','guide','https://www.xiaohongshu.com/discovery/item/689ab218000000002302576b?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBhQkZ087LGdUJuR29eFCuCpLa7iihBtTq_OFPMscKd6Q=&author_share=1&&apptime=1786549551&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=e75c34a2bd8146bf99a551497cde9766&xhsshare=CopyLink'],
['龙江第一湾｜恐高的人能去吗？😨','台阶沿山势而建，不是垂直悬崖。只要不看外面（靠山走），问题不大。山顶有护栏，站着不害怕。慢慢来别勉强。','guide','https://www.xiaohongshu.com/discovery/item/6a4b12a8000000000603468c?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBntxlcSQtjuFApUAzgco-vMLxdiKL61bwxwLJWecwUBE=&author_share=1&&apptime=1786549476&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=0dd8a35731384fd8b7454d1c0098e443&xhsshare=CopyLink'],
['龙江第一湾｜山上温度比山下低多少？🌡️','山顶温差约3-5度，风大时体感更冷。建议带件薄外套，即使夏天也备着。冬天要穿最厚的装备。','guide','https://www.xiaohongshu.com/discovery/item/6a72a8730000000035014c9f?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBj39FSDMBY1sWCllFF3OImVx4Ehve6eJ2iVwNiAeGz6I=&author_share=1&&apptime=1786549542&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=0b992dc45c04404a991c101b48be4838&xhsshare=CopyLink'],
['龙江第一湾｜手机也能拍出Ω形✌️','全景模式从右往左扫，把整个Ω形弯收进一张照片。手要稳，慢慢移动。iPhone超广角也很好用。','photo'],
['龙江第一湾｜下山后的犒赏🍲','山下有小餐馆，铁锅炖鱼是招牌。刚爬完山来一锅热乎的汤，幸福感爆棚。人均60左右，味道不错。','food'],
['龙江第一湾+乌苏里浅滩一日游🚗','建议顺序：上午龙江第一湾（趁体力好爬台阶）→中午山下吃饭→下午乌苏里浅滩（体力消耗小）。联票省钱又省心。','guide'],
['龙江第一湾｜冬季雪景版❄️','冬天的Ω形弯被白雪环绕，像水墨画的线条。台阶会清扫但还是要小心结冰。穿防滑鞋，带登山杖。雪景值得多穿几件！','photo']
],
'松苑公园':[
['漠河松苑公园｜城中原始森林🌲','5·6大火后幸存的原始松林，很有历史意义。林子里凉爽幽静，适合散步。了解一下大兴安岭火灾的历史，令人唏嘘。','guide','https://www.xiaohongshu.com/discovery/item/6a7c37660000000026034028?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBANtqFWubpOzlQr6phc3z6dzneFqooyWLhrrf3X6SC0g=&author_share=1&&apptime=1786549584&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=f7bacc9a2d3848d5aa41086d2e0440e2&xhsshare=CopyLink'],
['松苑公园｜大兴安岭火灾纪念馆🏛️','公园内的纪念馆记录了1987年那场大火的历史。展馆免费但禁止拍照。看完心情会有些沉重，但值得了解。','guide','https://www.xiaohongshu.com/discovery/item/6a703feb000000003301ca02?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBbyxRKhwNu0Lp2nBCr2eCFwg4EHLYSHZ58J2Fx9bqi80=&author_share=1&&apptime=1786549598&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=53dba0b12ae845d58881635638f98b67&xhsshare=CopyLink'],
['松苑公园｜城市绿肺天然氧吧🍃','松林密集，负氧离子超高。深呼吸几口感觉整个人都通透了。本地人都来这里晨练，是漠河人的后花园。','guide','https://www.xiaohongshu.com/discovery/item/6a7c6a7f000000002402de76?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBANtqFWubpOzlQr6phc3z6W6X6myVcd6ELAF2kts3-qs=&author_share=1&&apptime=1786549616&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=3d2fe49ee6d7466a84626db3901097f3&xhsshare=CopyLink'],
['松苑公园｜森系拍照圣地📸','高耸的松树形成天然构图框。清晨雾气未散时拍最有氛围感。穿白色或大地色系衣服最出片。','photo','https://www.xiaohongshu.com/discovery/item/6a780b4100000000080126da?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB-vaiF7LqEElB6oOYmD3DWOz_Nx1Qe-lCeDXj7GFZBJE=&author_share=1&&apptime=1786549590&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=abaf3f7a219b482bb3b41db0afde1e69&xhsshare=CopyLink'],
['松苑公园｜亲子科普之旅🌲🔍','带孩子认识不同种类的松树：樟子松、落叶松、红松……捡松果、看松鼠，孩子能玩一上午。天然的自然课堂。','guide','https://www.xiaohongshu.com/discovery/item/6850cb76000000002100a413?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBZxuKxG8KimMm648QkmV6cGco5S-RjX0RiVd9R-zDaG0=&author_share=1&&apptime=1786549573&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=f7fcf59a410a488daae3b453398ea1f7&xhsshare=CopyLink'],
['松苑公园｜冬季雪景🌨️','雪后的松苑像童话世界，松枝上压着厚厚的雪。走在咯吱咯吱的雪地上，呼吸着清冷的空气。穿亮色衣服拍照超好看。','photo'],
['松苑公园｜漠河一日游起点📍','建议作为漠河行程第一站：先了解大火历史→再去其他景点会有更深理解。公园不大，1小时足够逛完。','guide'],
['松苑公园周边｜漠河早餐推荐🥣','公园北门有家粥铺，小米粥+咸鸭蛋+馒头，地道东北早餐。还有家包子铺，牛肉大葱馅超赞。','food'],
['松苑公园｜寻找小松鼠🐿️','公园里松鼠很多且不怕人。带点瓜子或松子，放在手心它们会来取。小朋友看到松鼠会超级兴奋。','guide'],
['松苑公园｜傍晚散步🌆','傍晚时分阳光穿过松林，光束感特别强。这时候公园里人最少，安安静静地走走，感受漠河的宁静。','photo']
],
'北极星广场':[

['北极星广场｜夜景比白天更美✨','广场灯光亮起后北极星雕塑会变色，超级好看。俯瞰县城万家灯火，很浪漫。建议晚上8-9点来，灯光最全。','photo','https://www.xiaohongshu.com/discovery/item/67e7b347000000000d01518a?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBVpltrS09lALyNwup63_vaGoDhON1yCPwkPJcmZpzshg=&author_share=1&&apptime=1786549645&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=3808273b01ab44ff95e92aa8b5ee242b&xhsshare=CopyLink'],
['北极星广场｜城市全景拍摄📸','站在广场最高处，漠河县城尽收眼底。用长焦可以拍到远处的山和森林。傍晚蓝调时刻（日落后的半小时）拍城市灯光最出片。','photo','https://www.xiaohongshu.com/discovery/item/69306771000000001e0016f5?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBdw-o5qSpZh4mwUA5WRTq9ATDVFD9_GFMU001gJaLipY=&author_share=1&&apptime=1786549651&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=7f411af66609439c997a155fe56e6409&xhsshare=CopyLink'],

['北极星广场｜带长辈来散步的好地方👴','坡道平缓，台阶不多，适合各年龄段。广场干净整洁，有座椅可以休息。黄昏时很多本地老人在这里跳广场舞。','guide','https://www.xiaohongshu.com/discovery/item/6a0667400000000037036bbe?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBHHqJ09SM9nrHEqecE7ZvzU3EzBlOERNYL6ZcEJO03xo=&author_share=1&&apptime=1786549657&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=40f3239effb8465e9daa7e0f84148953&xhsshare=CopyLink'],
['北极星广场｜北极星雕塑的寓意⭐','北极星指引方向，漠河又是中国最北，寓意"找到人生的方向"。很多游客在这里拍照许愿。','guide','https://www.xiaohongshu.com/discovery/item/68da45b70000000011014e41?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBcQdv8Id1JdbAN9EU7-lK9cPcqndkiO8mIfoI4Mgx9dw=&author_share=1&&apptime=1786549673&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=06245ad1acc84b6da6ea37b0ecd832de&xhsshare=CopyLink'],
['北极星广场周边｜漠河步行街🛍️','广场旁边就是漠河最热闹的商业街。可以买到蓝莓干、桦树茸等特产。价格比景区便宜，可以逛逛。','guide','https://www.xiaohongshu.com/discovery/item/688cae9c000000002302ca31?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBX2TbvpbPLd2OLV4U0eCZIhjL1vTghNwqkt_aVaGInq8=&author_share=1&&apptime=1786549665&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=600b9795d80b4539994cd8d374bcaf9f&xhsshare=CopyLink'],
['北极星广场｜白天vs夜景完全两种感觉🌞🌙','白天视野开阔可以看到远方山脉，适合拍全景。晚上灯光璀璨更有都市感。建议傍晚来，从日落看到夜景，一次体验两种美。','photo'],
['北极星广场｜拍延时摄影好地方🎥','从日落前开始拍延时，云卷云舒+城市亮灯的过程太治愈了。带上小三脚架，放在栏杆上就能拍。','photo'],
['北极星广场+松苑公园｜漠河市区半日游🗺️','上午松苑公园（1小时）→步行15分钟到北极星广场→中午附近吃饭。两个景点离得近，半天刚好。','guide']
],
'九曲十八弯':[
['九曲十八弯｜航拍视角太震撼了📸','额木尔河在湿地中蜿蜒曲折，登观景台可以看到全貌。如果有无人机一定要飞一下，没的话观景台也能拍到很好的照片。','photo','https://www.xiaohongshu.com/discovery/item/6a324020000000001c0262c9?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBxwwRuNC-XnunvSQqK5cT9EkTH1mTY7WKL37O_rfUAVA=&author_share=1&&apptime=1786549754&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=d4098fe6bb1944b9bb4a4331dbaa9167&xhsshare=CopyLink'],
['九曲十八弯｜观景台攻略🏗️','观景台高约30米，有电梯和楼梯。建议爬楼梯上去，每一层风景都不同。顶层视野最佳，但人也最多。','guide','https://www.xiaohongshu.com/discovery/item/6a487006000000000f01584b?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBHGHLDjAUhNQGliKiLrK_PPqwPrBL5grqkFy7ePirU4Q=&author_share=1&&apptime=1786549783&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=81f7db9d9ab646dea63d985e0bda81f6&xhsshare=CopyLink'],
['九曲十八弯｜什么季节最美？🍂','秋季9月中下旬最美！湿地变成金黄和红色的调色盘，河水像银色丝带穿过。春季也不错，绿色层次丰富。','photo','https://www.xiaohongshu.com/discovery/item/6a7c95060000000025005a47?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=video&xsec_token=CBANtqFWubpOzlQr6phc3z6bwr8Eq85wd9NlHvS2y0W78=&author_share=1&&apptime=1786549775&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=2d4836bf7bc5456b8c3ed762594f51c0&xhsshare=CopyLink'],
['九曲十八弯｜无人机航拍注意事项🚁','湿地风大注意飞行高度。日出后1小时光线最好，河面泛金光。注意不要飞太高，有时有低空管制。','guide','https://www.xiaohongshu.com/discovery/item/68d95bc2000000001301bdc7?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBS7Cvu860eqUAoePfDsuj7f1LUR4Cv0hBW3S-gJ9I-pA=&author_share=1&&apptime=1786549741&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=f253e056285c4cb784b672463ad12f47&xhsshare=CopyLink'],
['九曲十八弯｜手机拍出大片感📱','全景模式横着扫一遍，超广角也能拍出蜿蜒感。后期加滤镜把饱和度提高，让金色更浓郁。','photo'],
['九曲十八弯｜免费观赏点揭秘🆓','除了收费观景台，附近有个小山包也能看到部分景观。虽然不如观景台全面但免费。适合预算有限的背包客。','guide'],
['九曲十八弯｜雨后初晴是最佳时机🌈','下过雨后空气格外通透，远处的山和湿地层次分明。如果运气好还能看到彩虹横跨河道，绝美！','photo'],
['九曲十八弯｜自驾前往路线详解🚗','从漠河县城出发约40分钟车程。路况不错，导航可直达。停车场免费但车位不多。周末人多建议早去。','guide'],
['九曲十八弯｜秋季摄影团必去🍁','摄影爱好者秋季一定要来！每年9月15-25日是最佳拍摄期。建议住漠河，日出前出发，赶第一缕阳光。','photo'],
['九曲十八弯+北极星广场+松苑｜漠河一日游🗓️','建议路线：清晨九曲十八弯（拍日出）→上午返回市区松苑公园→午餐→下午北极星广场→晚上广场看夜景。','guide'],
['九曲十八弯｜冬季雪景版🤍','冬天的湿地全部被雪覆盖，河道变成白色线条。虽然看不到彩色但黑白的世界也很震撼。适合极简主义风格拍照。','photo']
],
'萧红故居':[
['萧红故居｜走进呼兰河传的文学世界📖','《呼兰河传》的写作背景地，了解这位传奇女作家的一生。故居保持了民国时期的风貌，院子不大但很有韵味。免费参观。','guide','https://www.xiaohongshu.com/discovery/item/6937c900000000001e024d67?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBeNuS9mRkyhcVviUpnkrkZeGDyVnW6yGk1H4Mx9qrc6g=&author_share=1&&apptime=1786549821&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=64213640468e48cfbf4f97787b6d3471&xhsshare=CopyLink'],
['萧红故居｜文学青年的朝圣地📚','如果你是萧红的读者，来这里会有强烈的共鸣。院里的老枣树、厢房、碾坊……仿佛书里的场景活了过来。建议重读《呼兰河传》再去。','guide','https://www.xiaohongshu.com/discovery/item/6a784b0000000000060062fd?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB-vaiF7LqEElB6oOYmD3DWE4ALXAqnYSqKrBHQ2PcTlE=&author_share=1&&apptime=1786549813&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=0ec5f5e61b8d4ecdae34c0ad7185341c&xhsshare=CopyLink'],
['萧红的一生｜故居里的故事🏡','从富家小姐到流亡作家，萧红短暂而传奇的一生在这里开始。展览馆有她的生平介绍和手稿复制品。看得让人唏嘘。','guide','https://www.xiaohongshu.com/discovery/item/69f33fbb000000001b023c68?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB1TnLlxnngSacEvgdYORO5xMdLjSN1SFyv3abhgbazx4=&author_share=1&&apptime=1786549804&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=033dc5583d3d4f7399736604c23906ac&xhsshare=CopyLink'],
['萧红故居拍照｜民国风写真📸','青砖灰瓦的老院子很适合民国风拍照。穿旗袍或者素色棉麻衣服最应景。院里的枣树和木门是最好的背景。','photo','https://www.xiaohongshu.com/discovery/item/6863abd30000000011002fa0?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBYhpF6mCPMUg-OrRkF9SSF6rzFnlwvwe2AfMz_ZntKzc=&author_share=1&&apptime=1786549809&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=1c8b90c4c2094795bf678977fe2fcbed&xhsshare=CopyLink'],
['萧红故居+呼兰天主教堂｜呼兰半日游🗺️','两个景点距离步行10分钟。建议先去萧红故居（1小时），再去教堂（30分钟）。中午在呼兰老城区吃顿饭。','guide'],
['萧红故居｜带书本去打卡📖','带上《呼兰河传》，在故居的院子里读几页。这种沉浸式阅读体验独一无二。拍张书和故居的合影，发朋友圈文艺范十足。','photo'],
['萧红故居｜免费但需要预约吗？🎫','目前免费参观，一般不需要预约。但节假日人多时可能限流。建议工作日上午去，人少安静体验好。','guide'],
['萧红故居周边美食🍜','呼兰区有家百年老店做锅包肉一绝。还有家铁锅炖大鹅，肉烂汤浓。人均40吃得很饱。','food'],
['萧红故居｜了解东北女性文学💪','萧红是东北女性文学的代表人物。她的作品关注底层女性命运，在中国现代文学史上地位重要。建议先了解再参观更有收获。','guide'],
['萧红故居｜适合一个人慢慢逛🚶','故居不大但需要静下心来品。建议不要赶时间，一个人慢慢走慢慢看。体会百年前一群人的生活和命运。','guide']
],
'呼兰天主教堂':[
['呼兰天主教堂｜哈尔滨小众哥特建筑⛪','建于1908年的哥特式教堂，双塔造型在东北很少见。建筑保存完好，拍照很出片。周边还有萧红故居，可以一起逛。','photo','https://www.xiaohongshu.com/discovery/item/6a1fa397000000002100b4e6?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB8vWf88qLgyu-bi7z5xKIDWo5gG0b2CywHJPJ1BSGmkE=&author_share=1&&apptime=1786549942&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=96899712aa53411db7db33cb41f3fc1b&xhsshare=CopyLink'],
['呼兰天主教堂｜建筑美学深度解析🏗️','典型的法国哥特复兴式建筑。尖拱窗、玫瑰窗、飞扶壁都能看到。虽然不是大教堂规模但在东北已经很难得了。','guide','https://www.xiaohongshu.com/discovery/item/6911905c000000000703b034?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBIThrvpoX9b18UUaxwAu4sLhuTJ_I2t3gDwJzkXKy86g=&author_share=1&&apptime=1786549906&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=531349a113964b019debc09c306407f1&xhsshare=CopyLink'],
['呼兰天主教堂拍照｜9个必拍角度📸','①正面双塔全景②侧45度光影③玫瑰窗特写④拱门框景⑤院落全景⑥逆光剪影⑦花窗透光⑧钟楼仰拍⑨与天空合影。穿素色最好看。','photo','https://www.xiaohongshu.com/discovery/item/69c659ea000000001a0363a0?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBOpF8vW2YV1E2I9wu3DAOVV-z700tPH89j81OxvYCxnE=&author_share=1&&apptime=1786549914&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=c57ddaf41d6e449c886a81762d853784&xhsshare=CopyLink'],
['呼兰天主教堂｜百年历史你知道吗？📖','1908年由法国传教士修建，是黑龙江最早的教堂之一。经历了战乱和政治运动依然保存完好，本身就是一个奇迹。','guide','https://www.xiaohongshu.com/discovery/item/6847f9a9000000002102f4a8?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB6valA7uBg014oGWCKA6mIs3ZzMxkR1dI83iQWyxATDw=&author_share=1&&apptime=1786549903&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=f6bb6688c98948f9ae0f8fa87c812c90&xhsshare=CopyLink'],
['呼兰天主教堂｜礼拜时间能进去吗？🙏','周末有弥撒活动，非教徒也可以在后面安静参观。平时大门可能锁着，可以从侧门进入院子。保持安静尊重信仰。','guide'],
['呼兰天主教堂｜最佳拍摄时间⏰','下午3-5点光线最好。阳光从西面照来，给教堂正面镀上一层金光。阴天也有阴郁的哥特感，各有味道。','photo'],
['呼兰天主教堂+萧红故居｜呼兰一日文化游🎭','两个景点走路10分钟，文艺气息满满。建议上午萧红故居→午饭→下午教堂拍照。一整天沉浸在文艺和历史中。','guide'],
['呼兰天主教堂｜一个人的婚纱照👰','很多情侣来这里拍婚纱照，哥特教堂做背景太浪漫了。即使一个人来，穿件好看衣服自拍也很美！','photo'],
['呼兰天主教堂｜冬日雪景版❄️','雪后的哥特教堂更有神秘感。白顶黑身对比强烈。人少安静，适合慢慢拍照。注意保暖，郊区比市区冷。','photo'],
['呼兰天主教堂｜交通攻略🚌','从哈尔滨市区坐公交约1小时可达。建议打车前往更方便，单程约40-50元。自驾导航可直接到门口。','guide']
],
'阳明滩大桥':[
['阳明滩大桥｜松花江上的巨龙🌉','哈尔滨的跨江大桥，全长超过3公里。可以在桥头拍照，或者开车经过感受松花江的宽阔。傍晚夕阳下的剪影特别美。','photo','https://www.xiaohongshu.com/discovery/item/694b860b000000001e027d32?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBwcsMYqARr-JLmUFGtxlTF8gc8DSue6A5YpdQfV31HfQ=&author_share=1&&apptime=1786550006&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=fe12215939064557ae81c3629cfd84e2&xhsshare=CopyLink'],
['阳明滩大桥｜哈尔滨最佳日落观赏点🌅','大桥西侧是看日落的最佳位置。太阳从松花江对岸落下，整个江面变成金红色。夏天8点左右日落，提前半小时到。','photo','https://www.xiaohongshu.com/discovery/item/69b6b00f000000002301751e?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB7sTr8txWzzD5OLLrKuIXfTMr78xaqmMgZCp9cEj1GrA=&author_share=1&&apptime=1786549995&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=bd5b7adf317c47e29de25bf0ec85790f&xhsshare=CopyLink'],
['阳明滩大桥｜夜景灯光秀✨','大桥晚上有灯光装饰，变换色彩很好看。从远处看像一条发光的丝带横跨松花江。最佳观赏点在江北岸的公园。','photo','https://www.xiaohongshu.com/discovery/item/6a62014d000000001c0103ff?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBz89WCSo1pm8TQFaGjxSjJ66ynCS-cYtHJF1PkWjK3A4=&author_share=1&&apptime=1786549999&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=24c1aef25f6f489c913489c65cb0a37f&xhsshare=CopyLink'],
['阳明滩大桥｜骑行穿越体验🚴','大桥有自行车道，骑行过桥吹着江风超爽！全程约3公里，骑行15-20分钟。建议租共享单车，方便快捷。','guide'],
['阳明滩大桥+太阳岛｜一日行程🗓️','上午太阳岛风景区→中午岛上吃饭→下午过阳明滩大桥→傍晚桥头看日落。一整天跨江之旅，完美。','guide'],
['阳明滩大桥拍照｜最佳机位揭秘📸','①桥头公园正对大桥拍全景②桥中央拍江面③桥下河边拍仰角④远处拍大桥+日落⑤航拍大桥线条。','photo'],
['阳明滩大桥｜冬季冰封江面❄️','冬天江面完全冰封，从桥上往下看白茫茫一片。和夏天完全是两种感觉。风超级大，穿最厚的衣服！','guide'],
['阳明滩大桥｜跑步打卡路线🏃','大桥全程3公里+两侧引道=约5公里，刚好一个5K。很多哈尔滨本地跑友在这里训练。江风迎面吹来很舒服。','guide'],
['阳明滩大桥｜松花江上最美的桥？⚖️','哈尔滨有四座跨江大桥，阳明滩是最新也是造型最现代的。松花江公路大桥更有年代感。各有特色，都可以打卡。','guide'],
['阳明滩大桥｜怎么去最方便？🚗','地铁3号线到XX站打车起步价。建议自驾或打车，桥头有停车位但不多。共享单车也能到，但要注意安全。','guide']
],
'太阳岛风景区':[
['太阳岛｜哈尔滨必去景点超全攻略☀️','松花江上的江心岛，公园很大可以逛半天。夏天绿树成荫，冬天有雪博会。坐缆车过江体验也不错。门票30元。','guide','https://www.xiaohongshu.com/discovery/item/6a737ea2000000000f03a800?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBibJcS7vyo3e8sJblM_2BT_Ls_pfW-yiIul1TEyEtte8=&author_share=1&&apptime=1786550044&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=93fde9cff2e54d9e99b57de1c00a2e47&xhsshare=CopyLink'],
['太阳岛｜缆车过江新体验🚡','坐缆车从松花江上空飞过，俯瞰整个江面和哈尔滨天际线。单程约10分钟，票价略贵但体验很棒。恐高慎入。','photo','https://www.xiaohongshu.com/discovery/item/6a49d02d000000002101bb98?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBa5xelVf9F_ftK1vvxqPTMZpKbbLfYlvCQxTzVQlbUrQ=&author_share=1&&apptime=1786550035&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=9f57838d39f543bc9544358e4d059cde&xhsshare=CopyLink'],
['太阳岛｜五大必打卡景点📍','①俄罗斯风情小镇②水阁云天③太阳瀑④花卉园⑤松鼠岛。按这个顺序走一圈刚好不绕路。','guide','https://www.xiaohongshu.com/discovery/item/6a3fe756000000001101e5f8?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBG7ksx-sbo4AgQOSXUFkj2nB9RLIA23wdrfNRZOyeULs=&author_share=1&&apptime=1786550039&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=8ff6a16e4e2f44c9a2c524df3dbe01e2&xhsshare=CopyLink'],
['太阳岛｜亲子游天堂👨‍👩‍👧','松鼠岛是小朋友最爱！可以喂松鼠、看小动物。还有游乐场、划船等项目。一家人玩一天都不会腻。','guide'],
['太阳岛｜冬季雪博会🎿','每年冬季有雪雕艺术博览会，各种巨型雪雕震撼人心。哈尔滨冰雪节的重要组成部分。门票比冰雪大世界便宜。','guide'],
['太阳岛拍照｜森系大片怎么拍📸','太阳岛植被丰富，随便一处都是森系背景。推荐花卉园（花季）、白桦林、水边柳树。穿浅色系最出片。','photo'],
['太阳岛美食｜岛上吃什么？🍢','岛上有小吃街，烤红肠、锅包肉、马迭尔冰棍都能吃到。建议自带一些零食和水，岛上价格偏贵。','food'],
['太阳岛｜一个人发呆的好地方🧘','找片草地或水边长椅坐下，看云看水看人。岛很大总能找到安静的角落。带本书可以待一下午。','guide'],
['太阳岛｜四季完全不同的风景🍀🍂❄️','春有百花夏有绿荫，秋有红叶冬有雪雕。每个季节来都有惊喜。本地人建议一年来四次。','guide'],
['太阳岛｜交通方式全攻略🚌🚡🚗','缆车（最酷）、轮渡（最地道）、打车（最方便）、公交（最省钱）。推荐缆车去轮渡回，两种体验都get。','guide'],
['太阳岛｜晨跑路线推荐🏃','岛上有环岛步道约8公里。早上空气好、人少、凉快。跑完在岛上吃个早餐，元气满满开始一天。','guide']
],
'中央大街':[
['中央大街｜百年老街+马迭尔冰棍🍦','哈尔滨最热闹的步行街！欧式建筑一条街，一定要吃马迭尔冰棍（原味最经典）。晚上灯光亮起更美，建议傍晚来逛。','food','https://www.xiaohongshu.com/discovery/item/69c7593200000000210048db?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBHrqR0YLK44Vt9Io7RZ_I9Nk0h3ZJiOtcDoF7m-RbQMo=&author_share=1&&apptime=1786550138&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=d823226e2e094fd59d73e8bb75237103&xhsshare=CopyLink'],
['中央大街｜每一栋建筑都是历史🏛️','从1900年开始，中央大街汇集了文艺复兴、巴洛克、折中主义等多种建筑风格。建议下载一个建筑导览APP，边走边了解。','guide','https://www.xiaohongshu.com/discovery/item/69479000000000001d03bb13?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBHSs2UF8PQQr3Maf5M4FjV2x7yowNmmRG1ZkxwogOAuA=&author_share=1&&apptime=1786550131&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=43e43cd324d549569d76a5f4174de233&xhsshare=CopyLink'],
['中央大街美食攻略｜从街头吃到街尾🍢','①马迭尔冰棍②华梅西餐厅③老昌春饼④俄式列巴⑤烤红肠⑥锅包肉⑦铁锅炖⑧格瓦斯。准备好空着肚子来！','food','https://www.xiaohongshu.com/discovery/item/698882e4000000000b00acbd?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBTIxuoJIhUkZXaCkPvL87T_PZHf-EoIhSLz_kCglPuRo=&author_share=1&&apptime=1786550115&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=e0edefab800a404184d70f025f8bf3ae&xhsshare=CopyLink'],
['中央大街拍照｜10个最佳机位📸','①街口牌坊②马迭尔宾馆③华梅西餐厅门头④教育书店穹顶⑤方石路面低角度⑥有轨电车⑦欧式路灯⑧傍晚灯光⑨圣诞节日装饰⑩雪后街景。','photo','https://www.xiaohongshu.com/discovery/item/6a262ca10000000017028aa4?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBawvAf2K4CEvSf6Kdan3T2Du-3aBIERq2NyugXjMMmSQ=&author_share=1&&apptime=1786550125&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=1ae12540dd344cf5915e66d5ce00c2bf&xhsshare=CopyLink'],
['中央大街｜冬季风情❄️','冬天中央大街变身冰雪童话世界！路中间有冰雕展，灯光一打晶莹剔透。边吃马迭尔冰棍边赏冰雕，冰火两重天。','guide','https://www.xiaohongshu.com/discovery/item/6a43a14d0000000017028fac?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CB4KN27cdXXiLpG4-Fmu0Epv6IWb-jUr4qLMDi9yG-84I=&author_share=1&&apptime=1786550102&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=ed73c23f9f474a19b75a1abb04cb56be&xhsshare=CopyLink'],
['中央大街｜方石路面的秘密','脚下的方石路有百年历史，每块石头都是从俄罗斯运来的花岗岩。走在上面凹凸不平的感觉，是历史在脚下的触感。','guide','https://www.xiaohongshu.com/discovery/item/6a75d02c000000002202d577?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBS6s2FYIRzcDtkJKql9jgGBIl3nJUAXT9sTQgWlTGTMU=&author_share=1&&apptime=1786550107&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=38734b7bca224aaca641c2a0afe927be&xhsshare=CopyLink'],
['中央大街+防洪纪念塔+松花江｜经典路线🗺️','中央大街走到头就是防洪纪念塔和松花江畔。建议傍晚走中央大街→看防洪纪念塔→江边看日落。一条龙完美。','guide'],
['中央大街｜购物指南🛍️','秋林公司买红肠和大列巴，俄罗斯商品店买套娃和巧克力。沿街还有很多特色手工艺店。货比三家，有些店价格虚高。','guide'],
['中央大街｜避开人群的最佳时间⏰','早上8-9点人最少，适合拍照。傍晚最热闹但最有氛围。周末下午人最多。早起的鸟儿有干净的街景拍。','photo'],
['中央大街｜俄式西餐推荐🍽️','华梅西餐厅（百年老店）、马迭尔西餐厅、波特曼西餐厅并列"中央大街西餐三巨头"。罐焖牛肉、红菜汤、黑面包是标配。','food'],
['中央大街｜带父母的慢游攻略👴👵','走累了随时有长椅休息，老人友好。马迭尔宾馆可以进去参观（免费）。节奏放慢，逛一会坐一会，慢慢享受。','guide'],
['中央大街｜一个人的浪漫🌙','晚上一个人走在百年老街上，看灯光闪烁，听街头艺人拉小提琴。买根马迭尔冰棍慢慢吃，独处的浪漫最美。','guide']
],
'黑龙江省博物馆':[
['黑龙江省博物馆｜提前预约！免费参观🏛️','一定要在官方小程序提前预约！馆内有东北历史、自然标本等展览，建筑本身就是俄式风格。建议预留2小时参观。','guide','https://www.xiaohongshu.com/discovery/item/69e3415e000000001f005e35?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBLCpRtZBbY2tGPqgka4Cl07cMOs-IJKkQ76KFoIs4njo=&author_share=1&&apptime=1786550192&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=d48e8f81dff74d88b7265e35f154f3d3&xhsshare=CopyLink'],
['黑龙江省博物馆｜建筑本身就是文物🏗️','博物馆建筑建于1906年，是哈尔滨最老的俄式建筑之一。米黄色外墙+绿色穹顶，典型的俄罗斯风格。建筑爱好者会很喜欢。','photo','https://www.xiaohongshu.com/discovery/item/69d8c12b000000001a02d8e9?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBIZZwce6S7gsX-taeRMMz-WAsIMg5eEXpvqDFEfCXtRY=&author_share=1&&apptime=1786550187&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=9bea5a8e6f634bc1aab8d864e02294cb&xhsshare=CopyLink'],
['黑龙江省博物馆｜镇馆之宝一览💎','①铜坐龙（金代）②银鎏金面具③猛犸象化石④新石器时代玉器。按朝代顺序参观，路线清晰。','guide','https://www.xiaohongshu.com/discovery/item/6a5992ce000000001302fba8?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBg85zKGpy040yibzEDol0kZukQOAHr07b-1vQUKYHOvc=&author_share=1&&apptime=1786550220&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=2c8d5881d3e64378bb0513aca42fa6bf&xhsshare=CopyLink'],
['黑龙江省博物馆拍照｜古典建筑光影📸','建筑内外的光影都很美。旋转楼梯、彩色玻璃窗、穹顶都是拍照好背景。不允许用闪光灯和三脚架，手机拍摄即可。','photo','https://www.xiaohongshu.com/discovery/item/69ebe54b000000003502776f?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBw0fqH0qtVMjzRq-_-XyvYbrJcHKkLvk4AXQkiN6KPxs=&author_share=1&&apptime=1786550216&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=a4ee489556f24e7c840d57f550c8bc97&xhsshare=CopyLink'],
['博物馆+果戈里大街｜哈尔滨文化半日游','上午博物馆（2小时）→步行10分钟到果戈里大街→果戈里书店+秋林公司→午餐。文化人的半日行程。','guide'],
['省博观展tips｜避开拥挤时段⏰','周二到周五上午人最少。周末下午是人流高峰。提前三天在公众号预约，现场可能没号。周一闭馆别忘了！','guide'],
['带娃逛省博｜如何让小朋友不无聊👶','猛犸象化石和恐龙展区孩子最爱。可以提前准备几个小问题让孩子在馆里找答案，变成寻宝游戏。','guide'],
['黑龙江省博物馆｜免费导览服务🎧','博物馆提供免费讲解器（押金100元）。还有志愿者定时讲解，时间在入口处公告。强烈建议使用，了解很多展品背后的故事。','guide'],
['黑龙江省博物馆周边美食🍜','博物馆出来走5分钟有家东北饺子馆（手工现包）。还有家老式麻辣烫，哈尔滨人从小吃到大。','food'],
['逛完省博的感受💭','了解黑龙江从远古到近代的历史，对这片黑土地有了更深的理解。尤其是金代文化和哈尔滨开埠史，值得细看。','guide']
],
'果戈里大街':[
['果戈里大街｜比中央大街更local的老街🏙️','没有中央大街那么商业化，更有生活气息。秋林公司、果戈里书店都值得逛。沿街有很多老建筑和地道美食。','food','https://www.xiaohongshu.com/discovery/item/6979732e000000001a024a6e?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBtoaxjD4iZ9AJfDlxpsZ-sw6iKartQY_PUf34PWisUE8=&author_share=1&&apptime=1786550265&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=9b58d4b8ccc741b080bb7426ed7731b9&xhsshare=CopyLink'],
['果戈里书店｜中国最美书店之一📚','位于果戈里大街的欧式书店，被誉为哈尔滨最美书店。装修复古有格调，拍照看书两相宜。可以点杯咖啡坐一下午。','photo','https://www.xiaohongshu.com/discovery/item/694fb56f0000000022009299?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBlaetZIcg6VGLEwhbZG6QsKyL70bue4kntIK0GHo7EPM=&author_share=1&&apptime=1786550261&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=3a36f8116f5b4a0fae817862f079da34&xhsshare=CopyLink'],
['果戈里大街｜哈尔滨人的日常生活🚶','这里没有熙熙攘攘的游客，更多的是本地人的日常。菜市场、老理发店、修鞋摊……真实的哈尔滨生活面貌。','guide','https://www.xiaohongshu.com/discovery/item/69ddb5ae000000001a023101?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBiXtyNDaZGRtunHsTyQxMH68NlzY5KeULN_ixk3kS34Y=&author_share=1&&apptime=1786550254&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=9976199eba5b4ba2bbb65ab8f8a69a4e&xhsshare=CopyLink'],
['果戈里大街美食｜本地人私藏菜单🍜','推荐：①老仁义蒸饺②张飞扒肉③尹胖子油炸糕④南极冰棍。都是本地人从小吃到大的老店，比网红店好吃多了。','food','https://www.xiaohongshu.com/discovery/item/697f275d000000001a0255c6?app_platform=harmony&app_version=9.40.1&share_from_user_hidden=true&xsec_source=app_share&type=normal&xsec_token=CBJNDssgykrVwC74gqXb0ShjdVuQtLPuFAG0SBmPNg1-I=&author_share=1&&apptime=1786550257&ignoreEngage=true&shareRedId=N0k2RDc5O082NzUyOTgwNjc0OTo6Rz85&share_id=70c22cf6aa8848259d1a8b5eb0eb2dbb&xhsshare=CopyLink'],
['果戈里大街拍照｜烟火气街拍📸','街拍的最佳去处！老建筑+来往人群=最有生活气息的街头摄影。下午光线透过梧桐树洒在街上，光影绝美。','photo'],
['秋林公司｜百年老商场探店🛒','果戈里大街的地标。负一层卖正宗秋林红肠和大列巴（比景区便宜）。楼上可以买到俄罗斯巧克力和蜂蜜。','guide'],
['果戈里大街+中央大街｜一天逛两条街⚖️','果戈里大街（上午）更本地更安静，中央大街（傍晚）更热闹更有氛围。两条街氛围完全不同，都值得体验。','guide'],

function hashStr(s,mod){var h=0;for(var i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return Math.abs(h)%mod;}

// ===== XHS Batch State (random + 换一批) =====
var xhsBatchState={};
function getXhsBatchState(name){
if(!xhsBatchState[name]){xhsBatchState[name]={used:[],rendered:[],notes:XHS_NOTES_LIB[name]||[]};}
return xhsBatchState[name];
}
function pickRandomNotes(name,count){
var state=getXhsBatchState(name);var notes=state.notes;
if(notes.length===0)return[];
var pool=[];for(var i=0;i<notes.length;i++){if(state.used.indexOf(i)<0)pool.push(i);}
if(pool.length===0){state.used=[];for(var i=0;i<notes.length;i++)pool.push(i);}
shuffleArray(pool);var take=Math.min(count,pool.length);
var picked=pool.slice(0,take);
for(var i=0;i<picked.length;i++)state.used.push(picked[i]);
// Store rendered indices for view-B card onclick
state.rendered=picked.slice(0,take).map(function(idx){return idx;});
return picked.map(function(idx){return getXhsNoteObj(name,idx);});
}
// Get the rendered note index for a specific card in view-B
function getRenderedNoteIdx(name,cardIdx){
var state=getXhsBatchState(name);
if(state&&state.rendered&&cardIdx<state.rendered.length)return state.rendered[cardIdx];
return 0;
}
function refreshXhsBatch(name){var state=getXhsBatchState(name);if(state&&state.used.length>=state.notes.length)state.used=[];return pickRandomNotes(name,8);}

function cloudGetSyncData(cb){
  var url='https://api.github.com/repos/'+CLOUD_SYNC.repo+'/contents/'+CLOUD_SYNC.path;
  fetch(url,{headers:{'Authorization':'token '+CLOUD_SYNC.token,'Accept':'application/vnd.github+json'}})
    .then(function(r){if(r.status===404){cb(null);return null;}return r.json();})
    .then(function(data){if(!data){cb(null);return;}CLOUD_SYNC.sha=data.sha;try{var raw=atob(data.content.replace(/\n/g,''));var content=JSON.parse(decodeURIComponent(escape(raw)));cb(content);}catch(e){cb(null);}})
    .catch(function(e){cb(null);});
}
function cloudPutSyncData(data,cb){
  var url='https://api.github.com/repos/'+CLOUD_SYNC.repo+'/contents/'+CLOUD_SYNC.path;
  var content=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  var body={message:'sync '+new Date().toISOString(),content:content};
  if(CLOUD_SYNC.sha)body.sha=CLOUD_SYNC.sha;
  fetch(url,{method:'PUT',headers:{'Authorization':'token '+CLOUD_SYNC.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(data){if(data.content&&data.content.sha)CLOUD_SYNC.sha=data.content.sha;cb(true);})
    .catch(function(e){cb(false);});
}

function mergeSyncData(remote){
  if(!remote)return false;
  var changed=false;
  if(remote.companions&&Array.isArray(remote.companions)){
    var local=getCompanions();var byId={};
    local.forEach(function(c){byId[c.id]=c;});
    remote.companions.forEach(function(c){
      if(c.id){
        if(!byId[c.id]){byId[c.id]=c;changed=true;}
        else{var lt=byId[c.id].updatedAt||0;var rt=c.updatedAt||0;if(rt>lt){byId[c.id]=c;changed=true;}}
      }
    });
    if(changed){localStorage.setItem('wbsj_companions',JSON.stringify(Object.values(byId)));}
  }
  if(remote.favs){var lf=getFavs();var fc=false;for(var uid in remote.favs){if(!lf[uid]){lf[uid]=remote.favs[uid];fc=true;}}if(fc)localStorage.setItem('wbsj_favs',JSON.stringify(lf));}
  if(remote.supps){var ls=getSupps();var sc=false;for(var key in remote.supps){if(!ls[key]){ls[key]=remote.supps[key];sc=true;}}if(sc)localStorage.setItem('wbsj_supps',JSON.stringify(ls));}
  if(remote.privates){var lp=getPrivates();var pc=false;for(var uid in remote.privates){if(!lp[uid]){lp[uid]=remote.privates[uid];pc=true;}}if(pc)localStorage.setItem('wbsj_privates',JSON.stringify(lp));}
  return changed;
}
function scheduleCloudSync(){

  CLOUD_SYNC.syncTimer=setTimeout(function(){doCloudSync();},3000);
}
function doCloudSync(){
  if(CLOUD_SYNC.syncing)return;
  CLOUD_SYNC.syncing=true;CLOUD_SYNC.lastSyncStatus='syncing';updateSyncUI();

    if(remote){mergeSyncData(remote);}
    var payload=getSyncPayload();
    cloudPutSyncData(payload,function(ok){
      CLOUD_SYNC.syncing=false;CLOUD_SYNC.lastSyncTime=Date.now();
      CLOUD_SYNC.lastSyncStatus=ok?'success':'error';updateSyncUI();
      if(curTab==='profile')renderProfile();rerenderDay(curDay);
    });
  });
}
function cloudSyncOnLoad(){
  CLOUD_SYNC.syncing=true;CLOUD_SYNC.lastSyncStatus='syncing';updateSyncUI();
  cloudGetSyncData(function(remote){
    if(remote){var changed=mergeSyncData(remote);if(changed){if(curTab==='profile')renderProfile();rerenderDay(curDay);}}
    CLOUD_SYNC.syncing=false;CLOUD_SYNC.lastSyncTime=Date.now();
    CLOUD_SYNC.lastSyncStatus=remote?'success':'idle';updateSyncUI();
    scheduleCloudSync();
