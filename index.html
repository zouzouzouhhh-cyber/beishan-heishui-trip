// ===== Map Navigation (URL Scheme Direct — 一步直达App) =====
var _pendingWebUrl='';
function isInWechat(){
var ua=navigator.userAgent;
return /MicroMessenger/i.test(ua);
}
function openMapApp(name,lng,lat,addr){
var text=name||'';
if(addr&&addr!=='待补充'&&addr!==name&&addr!=='无')text+=' '+addr;
// Always copy address to clipboard FIRST (safety net)
copyAddress(text,lng,lat);
var isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
var isAndroid=/Android/i.test(navigator.userAgent);
// Build direct URL scheme
var scheme='';
if(lng&&lat){
if(isIOS)scheme='iosamap://path?sourceApplication=bssh&dname='+encodeURIComponent(name||'')+'&dev=0&lat='+lat+'&lon='+lng;
else scheme='androidamap://navi?sourceApplication=bssh&lat='+lat+'&lon='+lng+'&dev=0&style=2&keywords='+encodeURIComponent(name||'');
}else{
scheme=(isIOS?'iosamap://':'androidamap://')+'path?sourceApplication=bssh&dname='+encodeURIComponent(name||'')+'&dev=0';
}
// Build web fallback URL (微信环境使用)
var webUrl;
if(lng&&lat){
webUrl='https://uri.amap.com/navigation?to='+lng+','+lat+','+encodeURIComponent(name||'')+'&mode=car&callnative=1&src=bssh';
}else if(addr&&addr!=='待补充'&&addr!=='无'){
webUrl='https://uri.amap.com/search?keyword='+encodeURIComponent(addr)+'&callnative=1&src=bssh';
}else{
webUrl='https://uri.amap.com/search?keyword='+encodeURIComponent(name)+'&callnative=1&src=bssh';
}
// ===== 微信环境：弹出引导半屏弹窗 =====
if(isInWechat()){
_pendingWebUrl=webUrl;
$('navGuideModal').classList.add('active');
return;
}
// ===== 非微信环境：直接用URL Scheme唤起高德App =====
if(scheme){
window.location.href=scheme;
setTimeout(function(){
if(document.visibilityState!=='hidden'&&!document.hidden){
window.location.href=webUrl;
}
},2200);
}else{
window.location.href=webUrl;
}
}
function closeNavGuide(){
$('navGuideModal').classList.remove('active');
// 关闭弹窗后自动跳转网页版高德作为备用
if(_pendingWebUrl){
setTimeout(function(){
window.location.href=_pendingWebUrl;
_pendingWebUrl='';
},300);
}
}
// Copy address to clipboard
function copyAddress(text,lng,lat){
var copyText=text||'';
if(lng&&lat)copyText+='\n坐标: '+lat+', '+lng;
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(copyText).then(function(){showToast('📋 已复制地址，可粘贴到高德地图搜索');}).catch(function(){fallbackCopy(copyText);});
}else{fallbackCopy(copyText);}
}
function fallbackCopy(txt){
var ta=document.createElement('textarea');ta.value=txt;
ta.style.position='fixed';ta.style.left='-9999px';ta.style.top='0';
document.body.appendChild(ta);ta.focus();ta.select();
try{document.execCommand('copy');showToast('📋 已复制地址，可粘贴到高德地图搜索');}catch(e){showToast('复制失败，请长按地址手动复制');}
document.body.removeChild(ta);
}

// ===== Checklist =====
function loadCheckStates(){var uid=getCurrentUserId();var key='bssh_checklist'+(uid?'_'+uid:'');try{var s=localStorage.getItem(key);if(s)checkStates=JSON.parse(s);else{var d={};for(var i=0;i<checklistItems.length;i++)d[i]=false;checkStates=d;saveCheckStates();}}catch(e){checkStates={};}}
function saveCheckStates(){var uid=getCurrentUserId();var key='bssh_checklist'+(uid?'_'+uid:'');try{localStorage.setItem(key,JSON.stringify(checkStates));scheduleCloudSync();}catch(e){}}
function toggleCheck(idx){checkStates[idx]=!checkStates[idx];saveCheckStates();renderProfile();}
// ===== Long Press Drag Reorder =====
function setupDrag(){
var dw=$('daysWrapper');
dw.addEventListener('touchstart',function(e){var card=e.target.closest('.event-card');if(!card)return;isLongPress=false;lpTimer=setTimeout(function(){isLongPress=true;isDragging=true;card.classList.add('dragging');dragStartY=e.touches[0].clientY;dragEventIdx=parseInt(card.dataset.ev);showToast('拖动中...松手保存');},600);},{passive:true});
dw.addEventListener('touchmove',function(e){if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}if(!isDragging)return;e.preventDefault();var t=e.touches[0];var dy=t.clientY-dragStartY;var cards=document.querySelectorAll('#dayPage_'+curDay+' .event-card');if(cards.length===0)return;var ch=cards[0].offsetHeight+8;if(ch>0){var steps=Math.round(dy/ch);var ni=Math.max(0,Math.min(tripData[curDay].events.length-1,dragEventIdx+steps));if(ni!==dragEventIdx){var arr=tripData[curDay].events;var tmp=arr.splice(dragEventIdx,1)[0];arr.splice(ni,0,tmp);dragEventIdx=ni;dragStartY=t.clientY;rerenderDay(curDay);var nc=$('ev_'+curDay+'_'+ni);if(nc)nc.classList.add('dragging');}}},{passive:false});
dw.addEventListener('touchend',function(){if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}if(isDragging){isDragging=false;var c=document.querySelector('.event-card.dragging');if(c)c.classList.remove('dragging');showToast('已保存 ✓');setTimeout(function(){isLongPress=false;},400);}},{passive:true});
}
// ===== Init =====
function init(){
loadSettings();
renderAllDays();renderDayHeader();renderProfile();
var dw=$('daysWrapper');dw.addEventListener('touchstart',onTouchStart,{passive:true});dw.addEventListener('touchend',onTouchEnd,{passive:true});dw.addEventListener('mousedown',onMouseDown);document.addEventListener('mouseup',onMouseUp);
setupDrag();updateViewToggle();$('navPrev').classList.add('hidden');setTimeout(function(){updateDragHandle();},600);
document.body.addEventListener('touchmove',function(e){if(e.target.closest('.view-a,.view-b,.profile-scroll,.modal-content,.xhs-reader'))return;e.preventDefault();},{passive:false});
// Close XHS reader on outside tap
$('xhsBackdrop').addEventListener('click',closeXhsReader);
cloudSyncOnLoad();
}
init();
</script>
